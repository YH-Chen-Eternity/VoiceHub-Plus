# ============================================================
#  http 层共享限流 zone 与会话 Cookie 映射
#  放置：/etc/nginx/conf.d/00-zones.conf
#  00- 前缀保证在 voicehub.conf 之前加载。
# ============================================================

# audio-proxy 防滥用（voicehub.conf 的 location ^~ /audio-proxy/ 引用）
limit_req_zone  $binary_remote_addr zone=vh_aproxy:10m    rate=120r/m;
limit_conn_zone $binary_remote_addr zone=vh_aproxy_conn:10m;

# 从 Cookie 头提取 auth-token：连字符 cookie 名无 Nginx 内置变量，只能 map。
# voicehub.conf 的音频代理防线 2 依赖该变量，缺少本映射会导致请求全部 403。
map $http_cookie $vh_auth_token {
    default                 "";
    "~*(^|;\s*)auth-token=" "1";
}
