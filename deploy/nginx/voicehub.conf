# ============================================================
#  VoiceHub Nginx 站点配置（雷池 WAF 适配版）
#  放置：/etc/nginx/conf.d/voicehub.conf
#
#  架构：访客 → [Cloudflare] → 雷池 WAF(80/443, 终结 TLS) → 本机 Nginx:10080(纯 HTTP)
#        → 127.0.0.1:3001(rewriter) → voicehub:3000
#  说明：① 雷池接管 80/443 后，Nginx 退到本地回环端口，不再直接对公网服务；
#        ② TLS 证书改挂到雷池（控制台上传 CF 源证书），Nginx 侧不再需要 SSL 监听；
#        ③ 真实 IP 链路见同目录 cloudflare-real-ip.conf（需信任雷池回源网段）；
#        ④ 保留 rewriter 是为了不丢地域闸/封禁名单/攻击声明页/永久封禁/攻击日志。
#  部署与配置说明：见 deploy/safeline/README.md
# ============================================================



upstream voicehub_origin {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ---- 登录/搜索的细粒度限流（纵深防御；rewriter 已有一层，这里再兜一层）----
limit_req_zone $binary_remote_addr zone=vh_login:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=vh_api:10m  rate=600r/m;
limit_req_zone $binary_remote_addr zone=vh_aproxy:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=vh_aproxy_conn:10m;

# ---- HTTP：只做跳转 ----
# 雷池适配版：Nginx 不再监听 80。此块退到本地 10081，
# 如需雷池替你做 http→https 跳转，可在雷池站点里把 10081 加为第二个上游或由雷池强制 HTTPS。
server {
    listen 127.0.0.1:10081;
    server_name example.com;

    access_log /var/log/nginx/access.log combined;

    # 微信/公众号域名归属验证文件（必须能通过 HTTP/HTTPS 取到）
    location = /site-verification.txt {
        default_type text/plain;
        return 200 "REPLACE_WITH_VERIFICATION_CONTENT";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 主站（纯 HTTP，TLS 已由雷池终结）----
server {
    # 雷池回源入口：本地回环。雷池站点上游填 http://127.0.0.1:10080 即可。
    # 注意：部分雷池版本的安全策略禁止 127.0.0.1 作为上游（防 SSRF），
    #       此时改用本机内网地址，例如：
    #           listen 192.0.2.10:10080;   ← 换成你的内网 IP，切勿对公网放行该端口
    listen 127.0.0.1:10080;
    # listen 192.0.2.10:10080;
    server_name example.com;

    # ----- TLS 相关配置在雷池适配版下全部不需要（证书挂在雷池上）-----
    # 如需回滚为「Nginx 直接终结 TLS」的旧架构：
    #   1) 把上面的 listen 改回 443 ssl http2（及 IPv6）；
    #   2) 取消下面 ssl_* 注释；
    #   3) 雷池控制台把站点停用/删除，80/443 交还 Nginx。
    #
    # # Cloudflare Origin CA 证书（15 年），见 README 第 5 步
    # ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    # ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    #
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    #
    # # 只在 CF 回源时启用；如开启「Authenticated Origin Pulls」再打开下面两行
    # ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # 安全响应头（CF 也可以加，但源站也加一层）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https:; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    server_tokens off;

    # 上传/备份接口需要较大 body（音源解析、图片上传、备份恢复）
    client_max_body_size 64m;
    limit_conn vh_conn 40;
    limit_conn_status 429;
    client_body_timeout 60s;
    client_header_timeout 10s;

    # gzip（CF 也会压缩，但回源压缩能省 30Mbps 带宽）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ---------- 自托管字体（MiSans / SF Pro，原 jsdelivr）----------
    location ^~ /_fonts/ {
        alias /srv/voicehub/static/fonts/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 点赞列表修复:该 chunk 曾带 1 年 immutable 缓存,禁缓存以便修复生效
    location = /_nuxt/TdEmpaae.js {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # 后台看板 chunk：禁缓存，确保指纹解封/导出验证码等界面即时生效
    location = /_nuxt/DwZTo5sI.js {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # ---------- CDN 缓存策略 ----------
    # Service Worker：每次校验，避免 PWA 卡在旧版本
    location = /sw.js {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # 动态拼接的主题样式表：内容随配置变化，短缓存
    location = /_nuxt/vh-combined.css {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        access_log off;
    }

    # 带内容哈希的构建产物：一年 immutable
    location ~* "^/_nuxt/[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 主题 / 图片 / 音频资源：7 天
    location ~* ^/(?:themes|images|audio-match|assets)/ {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # PWA 清单：1 小时
    location = /manifest.webmanifest {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    # ---------- 静态资源：长缓存 ----------
    location /_nuxt/ {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|ttf|otf|mp3|m4a|webm|mp4)$ {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---------- 登录 / 注册：更严格限流 ----------
    location = /api/auth/login {
        limit_req zone=vh_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=vh_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
    }

    # ---------- WebSocket / SSE（音乐播放器、实时状态） ----------
    location /api/music/websocket {
        proxy_pass http://voicehub_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- 普通 API ----------
    location /api/ {
        limit_req zone=vh_api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_buffering off;          # 兼容流式响应
        proxy_read_timeout 300s;
    }

    # ---------- 其余（页面 / 上传等） ----------

    # ---------- 内部接口：仅容器网络可达 ----------
    location ^~ /__internal/ {
        return 404;
    }

    # ---------- security.txt（RFC 9116 漏洞报告联系方式）----------
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "# Security contact for 校园广播站点歌系统 (VoiceHub)\n# Owner: Site Owner\nContact: mailto:security@example.com\nPreferred-Languages: zh-CN, en\nCanonical: https://example.com/.well-known/security.txt\nExpires: 2027-04-21T23:59:59.000Z\n";
    }
    location = /security.txt {
        default_type text/plain;
        return 200 "# Security contact for 校园广播站点歌系统 (VoiceHub)\n# Owner: Site Owner\nContact: mailto:security@example.com\nPreferred-Languages: zh-CN, en\nCanonical: https://example.com/.well-known/security.txt\nExpires: 2027-04-21T23:59:59.000Z\n";
    }

    # ---------- robots.txt（允许搜索引擎抓取公开页面）----------
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /dashboard\nDisallow: /api/\n";
    }


    # ---------- 音频同源代理（网易 CDN 直链无 CORS 头 + http 混合内容，crossorigin=anonymous 无法播放） ----------
    resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
    resolver_timeout 5s;
    location ^~ /audio-proxy/ {
        # 防线1：要求浏览器同源标记（无头脚本/curl 默认不带，直接拒绝）
        if ($http_sec_fetch_site !~* "^(same-origin|none)$") {
            return 403;
        }
        # 防线2：要求携带会话 cookie（最低成本门槛，挡无 cookie 的裸脚本）
        if ($cookie_auth_token = "") {
            return 403;
        }
        set $vh_ahost "";
        if ($uri ~* "^/audio-proxy/([a-z0-9.-]+)\/") {
            set $vh_ahost $1;
        }
        # 域名白名单：仅允许网易音乐 CDN，防止开放代理
        if ($vh_ahost !~* "(^|\.)music\.126\.net$") {
            return 403;
        }
        rewrite ^/audio-proxy/[^/]+(/.*)$ $1 break;
        # 防线3-5：请求频率 / 并发连接 / 单连接带宽（正常播放 128k mp3 需 16KB/s，flac 约 190KB/s，均远低于限制）
        limit_req  zone=vh_aproxy burst=20 nodelay;
        limit_conn vh_aproxy_conn 4;
        limit_rate 384k;
        proxy_pass https://$vh_ahost;
        proxy_http_version 1.1;
        proxy_set_header Host $vh_ahost;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "*/*";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_ssl_server_name on;
        proxy_ssl_name $vh_ahost;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Cache-Control;
        # 缓存头不加 always：403/429 等拒绝响应绝不入 CF 缓存
        add_header Cache-Control "public, max-age=1200";
        access_log off;
    }

    location / {
        proxy_pass http://voicehub_origin;
        include /etc/nginx/snippets/voicehub-proxy.conf;
        proxy_read_timeout 120s;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
