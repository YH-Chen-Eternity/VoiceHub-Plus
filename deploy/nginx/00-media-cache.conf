# ============================================================
#  社区公开图片本地缓存
#  放置：/etc/nginx/conf.d/00-media-cache.conf
#  缓存目录需存在且可写：mkdir -p /var/cache/nginx/vh-media
# ============================================================
# 源站对公开图返回 public immutable，私有图返回 private no-store；
# nginx 尊重 no-store，因此私有/鉴权响应不会进入共享缓存。
# inactive=7d 是「未被访问的缓存对象」的清理周期；location 中 proxy_cache_valid 200 30d
# 是「缓存响应的有效期」。长期无人访问的对象 7 天后即被清理，再次访问需回源，属预期行为。
proxy_cache_path /var/cache/nginx/vh-media levels=1:2 keys_zone=vh_media:16m max_size=512m inactive=7d use_temp_path=off;
