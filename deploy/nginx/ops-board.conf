# ============================================================
#  VoiceHub-Plus · 运维数据看板（OpsBoard）Nginx 站点模板
#  放置：/etc/nginx/conf.d/ops-board.conf
#
#  【架构】管理员 → Cloudflare（橙云代理 + Access）→ 本机 Nginx:443（TLS 终结）
#          → 127.0.0.1:3000（Nuxt 应用）
#  看板是独立子域，仅管理员可经 CF Access 进入；主站流量的 WAF / rewriter
#  链路见同目录 voicehub.conf。本模板直接回源应用、不经过 rewriter
#  （CF Access 已在外层做身份把关，应用侧仍有 session + requireAdmin 兜底）。
#
#  【部署步骤】
#   1) DNS：在 Cloudflare 新增子域（例如 ops），开启橙云代理（Proxied），
#      指向源站公网 IP；源站防火墙 443 仅放行 Cloudflare 回源 IP 段，
#      避免有人绕过 CF Access 直连源站。
#   2) Cloudflare Access：新建 Self-hosted 应用并绑定该子域；
#      Policy 选 Include → Emails，仅允许管理员邮箱。
#      真实邮箱不写进本模板（示例：security@example.com /
#      admin@example.com），全部在 CF 控制台维护。
#   3) 证书：用 acme.sh 签发（建议 DNS-01，避免 80 校验与 Access 冲突），例如
#          acme.sh --issue --dns dns_cf -d example.com
#      安装到下方 ssl_certificate / ssl_certificate_key 的占位路径；
#      Cloudflare SSL/TLS 加密模式设为「Full (strict)」。
#   4) 真实 IP：确认同目录 cloudflare-real-ip.conf 已在 http 层加载
#      （set_real_ip_from 信任 CF 回源段）；本 server 将 real_ip_header
#      覆盖为 CF-Connecting-IP，使应用拿到真实访客 IP。
#   5) Cookie：确认应用 session cookie 的 Domain 为父域（.example.com），
#      否则 ops 子域读不到主站登录态，/api/auth/verify 会判定为未登录。
#   6) nginx -t && systemctl reload nginx。
#
#  【去敏感化约定】真实域名 / 内网 IP / 管理员邮箱 / token / 私钥一律不入库：
#   - server_name 固定 example.com，部署时由主 agent 替换为真实子域；
#   - 证书路径为通用占位，不含任何真实主机名；
#   - CF Access 邮箱列表只在 Cloudflare 控制台配置，模板内仅出现示例地址；
#   - 上游固定 127.0.0.1:3000（回环地址，无敏感性）。
#
#  【安全说明】CF-Access-* 头由 Cloudflare 注入并向下游透传，仅供应用侧
#   审计 / 识别使用，绝不能作为鉴权依据（客户端可伪造）。/api/ops-board/*
#   的访问控制仍以应用 session cookie + requireAdmin 为准。
#  【注意】若 voicehub.conf 回滚为「Nginx 直接终结 TLS」的旧架构，
#   请确保两者不要在同一 listen 地址上使用相同 server_name。
# ============================================================

# 统一缓存策略（http 层 map）：所有 add_header 集中在 server 层，
# 避免 location 内出现 add_header 导致 server 层安全头被覆盖的 Nginx 陷阱。
map $uri $ops_cache_control {
    default                 "no-store, must-revalidate";
    ~^/_nuxt/               "public, max-age=31536000, immutable";
    ~^/api/ops-board/       "no-store, must-revalidate";
    ~^/ops-board            "no-store, must-revalidate";
    ~^/api/auth/            "no-store";
}

upstream ops_board_origin {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---- HTTP：仅做跳转（CF Full strict 下正常回源不会走这里）----
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # ACME HTTP-01 校验如需保留，单独放开 /.well-known/acme-challenge/；
    # 采用 DNS-01 时直接整站跳转即可。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 看板主站（TLS 在本机终结）----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # ---- 证书路径占位（acme.sh 安装后替换，模板不含真实域名）----
    ssl_certificate     /etc/nginx/ssl/ops-board/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ops-board/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OPSBOARD_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 可选：开启 Cloudflare Authenticated Origin Pulls 后启用下面两行，
    # 保证只有持 CF 客户端证书的回源请求能到达源站。
    # ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # ---- 真实客户端 IP（配合 http 层 cloudflare-real-ip.conf）----
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ---- 安全响应头（全部集中在 server 层，写法参照 voicehub.conf）----
    # 新子域不轻易提交 hstspreload.org；确认后再决定是否加 preload。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), idle-detection=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control $ops_cache_control always;
    server_tokens off;

    client_max_body_size 8m;
    client_body_timeout 30s;
    client_header_timeout 10s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ---- 统一回源头（server 层，被各 location 继承）----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-Ray $http_cf_ray;

    # Cloudflare Access 身份相关头（仅透传，不作为鉴权依据，见顶部安全说明）
    proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header CF-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    proxy_set_header CF-Access-Client-Id $http_cf_access_client_id;
    proxy_set_header CF-Access-Application-Id $http_cf_access_application_id;

    # Nuxt SSR 的 Server-Timing 头较大，放大缓冲并隐藏；
    # 上游缓存头统一由上面的 map 控制，避免与 add_header 冲突。
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_hide_header Server-Timing;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;

    # ---- 看板 API：全部 no-store（端点自身已设，这里再兜一层）----
    location ^~ /api/ops-board/ {
        proxy_pass http://ops_board_origin;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---- 认证接口：客户端 middleware 的 initAuth 需要 /api/auth/verify ----
    location ^~ /api/auth/ {
        proxy_pass http://ops_board_origin;
        proxy_read_timeout 60s;
    }

    # ---- 看板页面：HTML 禁缓存，避免 SSR 内容被共享缓存 ----
    location ^~ /ops-board {
        proxy_pass http://ops_board_origin;
        proxy_read_timeout 60s;
    }

    # ---- 构建产物：长缓存 ----
    location ^~ /_nuxt/ {
        proxy_pass http://ops_board_origin;
        access_log off;
    }

    # ---- 其余（favicon / 字体 / 站点校验等）----
    location / {
        proxy_pass http://ops_board_origin;
        proxy_read_timeout 60s;
    }

    # 看板不对外暴露 robots 索引
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
